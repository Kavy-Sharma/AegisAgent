tools:
  turn_light_on:
    risk: LOW
  turn_light_off:
    risk: LOW
  read_temperature:
    risk: LOW
  activate_alarm:
    risk: HIGH

roles:
  guest:
    allowed_tools:
      - turn_light_on
      - turn_light_off
      - read_temperature
  admin:
    allowed_tools:
      - turn_light_on
      - turn_light_off
      - read_temperature
      - activate_alarm

rate_limits:
  default:
    max_calls: 5
    window_seconds: 60

detection:
  enabled: true
  mode: monitor            # monitor = log only | enforce = BLOCK actually stops the request
  review_threshold: 0.5
  block_threshold: 0.8
  context_window: 4
  detectors: [rules, context]
  scan_tool_outputs: true
  rules_file: security/rules/injection_rules.yaml

