<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ session.get('csrf_token', '') }}">
  <title>Sign In — AegisAgent</title>

  <script src="/static/js/theme-init.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/pages.css">
</head>
<body class="auth-body">
  <div class="auth-top-bar">
    <button type="button" class="btn-icon theme-toggle-btn" id="theme-toggle-btn" title="Toggle Light / Dark mode" aria-label="Toggle light / dark mode">
      <svg class="icon icon-sun"><use href="/static/icons.svg#icon-sun"></use></svg>
      <svg class="icon icon-moon"><use href="/static/icons.svg#icon-moon"></use></svg>
    </button>
  </div>

  <div class="auth-centered-container">
    <div class="card auth-card">
      <div class="auth-card-header">
        <h1 class="auth-card-title">AegisAgent</h1>
        <p class="auth-card-subtitle">A guard between an AI agent and the actions it can take.</p>
      </div>

      {% if error %}
      <div class="auth-alert alert-danger auth-alert-animated" id="auth-error-alert" role="alert">
        <svg class="icon"><use href="/static/icons.svg#icon-alert-triangle"></use></svg>
        <span class="auth-alert-text">{{ error }}</span>
      </div>
      {% endif %}

      {% if expired %}
      <div class="auth-alert alert-warn auth-alert-animated" role="alert">
        <svg class="icon"><use href="/static/icons.svg#icon-clock"></use></svg>
        <span class="auth-alert-text">Your session has expired due to 15 minutes of inactivity. Please sign in again.</span>
      </div>
      {% endif %}

      <form action="/login" method="POST" class="auth-form" id="login-form">
        <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">

        <div class="form-group mb-md">
          <label for="username" class="form-label">Username</label>
          <div class="input-wrap">
            <svg class="icon input-icon"><use href="/static/icons.svg#icon-user"></use></svg>
            <input type="text" id="username" name="username" class="form-input" placeholder="Enter username" required autocomplete="username" autofocus value="">
          </div>
        </div>

        <div class="form-group mb-lg">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrap">
            <svg class="icon input-icon"><use href="/static/icons.svg#icon-lock"></use></svg>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter password" required autocomplete="current-password" value="">
            <button type="button" class="password-toggle-btn" id="toggle-password-btn" title="Show or hide password" aria-label="Toggle password visibility">
              <svg class="icon"><use href="/static/icons.svg#icon-eye"></use></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">
          <span>Sign In</span>
        </button>
      </form>

      <div class="auth-card-footer">
        <span class="auth-simulation-note">Local simulation. No real devices are controlled.</span>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
