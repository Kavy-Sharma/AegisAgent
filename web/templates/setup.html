<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ session.get('csrf_token', '') }}">
  <title>Setup Administrator — AegisAgent</title>
  <script src="/static/js/theme-init.js"></script>
  <link rel="stylesheet" href="/static/css/aegis-ui.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-head">
        <a class="login-brand" href="/" aria-label="AegisAgent home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5l8-3z"/><path d="M8.5 12l2.5 2.5L16 9"/></svg>
          Aegis<b>Agent</b>
        </a>
        <h2 class="auth-title">Create Administrator</h2>
        <p class="login-subtitle">First-run master administrator setup.</p>
      </div>

      {% if error %}
      <div class="auth-alert danger" id="auth-error-alert" role="alert">
        <span class="auth-alert-text">{{ error }}</span>
      </div>
      {% endif %}

      <form action="/setup" method="POST" id="setup-form">
        <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">

        <div class="form-group">
          <label for="username" class="form-label">Administrator Username</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="e.g. admin" required autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Master Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter secure password" required minlength="10" autocomplete="new-password">
            <button type="button" class="input-toggle" id="toggle-password-btn" aria-label="Show or hide password" title="Show or hide password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm Password</label>
          <div class="input-wrap">
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Repeat master password" required minlength="10" autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn primary" id="setup-submit-btn">Initialize Administrator</button>
      </form>

      <p class="login-footer">Setup is permanently disabled once an administrator account is created.</p>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
