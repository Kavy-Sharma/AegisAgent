environment: office

tools:
  read_file:
    risk: LOW
    untrusted_output: true
  http_get:
    risk: LOW
    untrusted_output: true
  send_email:
    risk: HIGH
  run_sql:
    risk: HIGH
  export_all_customer_data:
    risk: HONEYPOT

roles:
  guest:
    allowed_tools:
      - read_file
      - http_get
      - export_all_customer_data
  admin:
    allowed_tools:
      - read_file
      - http_get
      - send_email
      - run_sql
      - export_all_customer_data

dynamic_escalation:
  enabled: true
  threshold: 0.5

intent_lock:
  enabled: true
  default_scope:
    - read_file
    - http_get

intents:
  file:
    keywords: [file, read, doc, document, text, open, read_file]
    tools: [read_file]
  web:
    keywords: [http, get, url, web, fetch, site, page, download, http_get]
    tools: [http_get]
  email:
    keywords: [email, mail, send, message, recipient, outbox, send_email]
    tools: [send_email]
  database:
    keywords: [sql, database, query, db, table, select, insert, update, delete, drop, run_sql]
    tools: [run_sql]
  export:
    keywords: [export, customer, backup, dump, export_all_customer_data]
    tools: [export_all_customer_data]

provenance:
  enabled: true

rate_limits:
  default:
    max_calls: 5
    window_seconds: 60

detection:
  enabled: true
  mode: enforce
  review_threshold: 0.5
  block_threshold: 0.8
  context_window: 4
  detectors: [rules, context]
  scan_tool_outputs: true
  rules_file: security/rules/injection_rules.yaml

approval:
  enabled: true
  provider: dashboard
  timeout_seconds: 60
  require_for_risk: [HIGH]
  require_for_review_verdict: true

hardware:
  mode: auto
  vid_pid:
    - "10C4:EA60"
    - "1A86:7523"
    - "303A:1001"
  location: "Jodhpur"
  serial_port: auto
  baud_rate: 115200
  broker_host: 127.0.0.1
  broker_port: 1883
  device_id: esp32-01
  mosquitto_exe: "C:\\Program Files\\mosquitto\\mosquitto.exe"
  ack_map:
    light_on: "EVENT: light_on_done"
    light_off: "EVENT: light_off_done"
    unlock_door: "EVENT: door_unlocked"
    alarm_on: "EVENT: alarm_started"
    alert_blocked: "EVENT: alert_blocked_shown"
    ping: "EVENT: ping_ack"

voice:
  enabled: false
